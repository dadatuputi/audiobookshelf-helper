<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
<header>
  <strong>Audiobookshelf Helper</strong>
  <a id="opts" href="#" title="Options">⚙</a>
</header>
<div id="status" class="status"></div>

<nav class="tabs">
  <button class="tab active" data-tab="server">To pull <span id="n-server" class="badge"></span></button>
  <button class="tab" data-tab="device">On device <span id="n-device" class="badge"></span></button>
  <button class="tab" data-tab="only">To push <span id="n-only" class="badge"></span></button>
  <span id="free" class="free"></span>
</nav>

<div class="row">
  <input id="filter" type="search" placeholder="filter…">
  <label class="small"><input type="checkbox" id="all"> all</label>
</div>

<ul id="list"></ul>

<footer>
  <button id="act" disabled>Select books</button>
  <button id="refresh" class="ghost" title="Re-read the device">↻</button>
</footer>
<script src="browser-polyfill.js"></script>
<script src="lib.js"></script>
<script src="popup.js"></script>
</body></html>
