name: Release

# Tag -> artefacts -> GitHub Release -> stores.
#
#   git tag v1.0.0-alpha.1 && git push --tags    prerelease: signed XPI + zips
#   git tag v1.0.0         && git push --tags    stable: also goes to the stores
#
# Prereleases are deliberately never submitted to a public store. They still
# get a *signed* Firefox add-on through AMO's unlisted channel, which needs no
# review and installs permanently - which is what an alpha is actually for.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0-alpha.1)"
        required: true
      dry_run:
        description: "Build and package, but do not publish anywhere"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Nothing ships without the full suite passing on the exact commit.
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  package:
    name: package
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      firefox_version: ${{ steps.v.outputs.firefox }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve version from the tag
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          python3 tools/release_version.py "$TAG"   # fails loudly on a bad tag
          {
            echo "tag=$TAG"
            echo "semver=$(python3 tools/release_version.py "$TAG" --field semver)"
            echo "firefox=$(python3 tools/release_version.py "$TAG" --field firefox)"
            echo "chrome=$(python3 tools/release_version.py "$TAG" --field chrome)"
            echo "prerelease=$(python3 tools/release_version.py "$TAG" --field prerelease)"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate icons
        # Rebuilt rather than trusted, so a stale committed PNG cannot ship.
        run: python3 extension/icons/make_icons.py

      - name: Build artefacts
        run: python3 tools/package.py --tag "${{ steps.v.outputs.tag }}"

      - uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: release/
          retention-days: 30

  github-release:
    name: github release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: release

      - name: Publish the release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          NOTES=$(mktemp)
          {
            echo "## Install"
            echo
            echo "**Firefox** — download the signed \`.xpi\` below if present, or"
            echo "load \`...-firefox-*.zip\` unpacked via \`about:debugging\`."
            echo
            echo "**Chrome** — unzip \`...-chrome-*.zip\` and load it unpacked"
            echo "at \`chrome://extensions\` with Developer mode on."
            echo
            echo "**Native helper (required)** — unzip \`...-native-*.zip\` and run"
            echo '```'
            echo "python3 install.py"
            echo '```'
            echo "then restart the browser. The helper is what writes to the device;"
            echo "the extension on its own cannot."
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> This is a prerelease. It is not published to any store."
            fi
          } > "$NOTES"
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          # Re-cutting a tag is a normal thing to want - an alpha that shipped
          # the wrong code, a build worth replacing - and `gh release create`
          # fails outright when a release for the tag already exists, which
          # left the only route as deleting the published one by hand. Update
          # it in place instead: same tag, same download URLs, new artefacts.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" \
              --prerelease="$PRERELEASE"
          else
            # --target only applies when gh has to create the tag itself, which
            # is the workflow_dispatch path; it defaults to the *default
            # branch*, so without this the tag would point at main while the
            # artefacts came from the dispatched ref. On a tag push the tag
            # already exists and this is ignored.
            gh release create "$TAG" release/*.zip \
              --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file "$NOTES" $FLAGS
          fi

  amo:
    name: firefox add-ons
    # github-release as well as package: this uploads onto the release, and
    # hanging both off package alone let them race. It worked only because
    # signing takes minutes and creating a release takes seconds.
    needs: [package, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund

      - name: Rebuild the Firefox bundle at the release version
        run: |
          python3 extension/icons/make_icons.py
          python3 extension/build.py --target firefox \
            --version "${{ needs.package.outputs.firefox_version }}"

      - name: Sign / submit
        id: sign
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice title=AMO::skipped - AMO_JWT_ISSUER/AMO_JWT_SECRET not set"
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A prerelease goes to the unlisted channel: signed and permanently
          # installable, but not published on addons.mozilla.org.
          CHANNEL=listed
          if [ "$PRERELEASE" = "true" ]; then CHANNEL=unlisted; fi
          {
            echo "attempted=true"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          echo "submitting to AMO ($CHANNEL)"
          npx web-ext sign \
            --source-dir extension/dist/firefox \
            --artifacts-dir release-xpi \
            --channel "$CHANNEL" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Attach the signed XPI to the release
        # always(), so a signing failure is still reported here rather than
        # skipping the step that explains it.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SEMVER: ${{ needs.package.outputs.semver }}
          ATTEMPTED: ${{ steps.sign.outputs.attempted }}
          CHANNEL: ${{ steps.sign.outputs.channel }}
        run: |
          shopt -s nullglob
          XPI=(release-xpi/*.xpi)
          if [ ${#XPI[@]} -eq 0 ]; then
            if [ "$ATTEMPTED" != "true" ]; then
              echo "::notice title=AMO::no credentials, so nothing was signed"
              exit 0
            fi
            if [ "$CHANNEL" = "listed" ]; then
              echo "::notice title=AMO::listed submission accepted; AMO signs it after review"
              exit 0
            fi
            # Unlisted signing hands the xpi back in the same run, so nothing
            # here means the submission did not succeed. Saying so quietly
            # would leave a release carrying four zips and no add-on anyone
            # can install, which is the shape of failure this project has
            # already shipped once.
            echo "::error title=AMO::signing was attempted on the unlisted channel and produced no xpi"
            exit 1
          fi
          # AMO names the file after the add-on's internal id, which reads as
          # noise beside audiobookshelf-helper-firefox-<version>.zip. The
          # version is the tag's, so the two match.
          DEST="release-xpi/audiobookshelf-helper-firefox-${SEMVER}.xpi"
          mv "${XPI[0]}" "$DEST"
          gh release upload "$TAG" "$DEST" --clobber

  chrome-web-store:
    name: chrome web store
    needs: package
    # Stable tags only. An alpha must never land in a public store queue.
    if: ${{ needs.package.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: release

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          ZIP=$(ls release/*-chrome-*.zip)
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          set +e
          python3 tools/publish_cws.py --zip "$ZIP" $DRY
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "::notice title=Chrome Web Store::skipped - credentials not configured"
            exit 0
          fi
          exit $code
