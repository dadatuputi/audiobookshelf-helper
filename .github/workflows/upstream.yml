name: Upstream watch

# Audiobookshelf has no reason to care that this extension exists, so the only
# warning of a breaking change is trying the new release. Weekly: if upstream
# has published a release newer than tests/real/abs-version.txt, run the full
# real-server suite against it. If it passes, move the pin, and the next CI run
# tests against it; if it fails, open an issue saying what failed, with the
# changelog lines that touch what this extension uses.
#
# The contract itself is asserted by tests/js/contract.test.js on every push.

on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, early
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    name: look for a newer Audiobookshelf
    runs-on: ubuntu-latest
    outputs:
      newer: ${{ steps.check.outputs.newer }}
      latest: ${{ steps.check.outputs.latest }}
      pinned: ${{ steps.check.outputs.pinned }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare upstream's releases with the pinned version
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_upstream.py
      - uses: actions/upload-artifact@v5
        if: steps.check.outputs.newer == 'true'
        with:
          name: upstream-report
          path: upstream-report.md
          retention-days: 30

  test:
    name: full suite against the newer release
    needs: check
    if: needs.check.outputs.newer == 'true'
    uses: ./.github/workflows/real-abs.yml
    with:
      abs_ref: ${{ needs.check.outputs.latest }}

  move-pin:
    name: test against it from now on
    needs: [check, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Move the pin and run CI on it
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
          PINNED: ${{ needs.check.outputs.pinned }}
        run: |
          echo "$LATEST" > tests/real/abs-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/real/abs-version.txt
          git commit -m "Test against Audiobookshelf $LATEST" \
                     -m "It passed the full real-server suite in run $GITHUB_RUN_ID, replacing $PINNED."
          git push
          # A push made with this token starts no workflow of its own, so ask
          # for the full CI run on the new pin explicitly.
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          echo "::notice title=Audiobookshelf $LATEST::passed; now pinned, CI started"

  report-failure:
    name: say what broke
    needs: [check, test]
    if: always() && needs.check.outputs.newer == 'true' && needs.test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: upstream-report
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ needs.check.outputs.latest }}
          PINNED: ${{ needs.check.outputs.pinned }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          { echo "The real-server suite fails against **Audiobookshelf $LATEST**; the tests stay pinned to $PINNED until it passes."
            echo
            echo "Failing run: $RUN (the job summaries and the playwright artifacts say what failed)."
            echo
            cat upstream-report.md; } > body.md
          TITLE="Audiobookshelf $LATEST fails the real-server suite"
          EXISTING=$(gh issue list --state open --label upstream --json number \
                       --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
            gh issue edit "$EXISTING" --title "$TITLE"
          else
            gh label create upstream --color 0E8A16 \
              --description "Changes upstream in Audiobookshelf" 2>/dev/null || true
            gh issue create --title "$TITLE" --label upstream --body-file body.md
          fi
