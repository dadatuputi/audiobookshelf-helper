name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole suite before it ships anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The native host is the component that touches the filesystem, so it is
  # tested on every OS it ships to, across the Python versions those OSes
  # realistically carry.
  native:
    name: native host (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build extension bundles
        run: python extension/build.py
      - name: Run native host + build/install/packaging tests
        run: python -m unittest discover -s tests/python -p "test_*.py" -v
      - name: Installer dry-run (real paths for this OS)
        run: python native/install.py --dry-run

  # Round-trip the actual stdio protocol against a fake library and a fake
  # "device" directory, on each OS. Catches path-separator and encoding bugs
  # that unit tests on Linux alone would miss.
  native-smoke:
    name: host smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Round-trip the real engine, then the host protocol
        shell: python
        run: |
          import json, struct, subprocess, sys, tempfile, pathlib
          sys.path.insert(0, ".")
          from absh import device, sync, index

          # 1. The engine, downloading from a stand-in server onto a fake device.
          tmp = pathlib.Path(tempfile.mkdtemp())
          dev = tmp / "dev"
          dev.mkdir(parents=True)

          class Resp:
              headers = {"Content-Type": "audio/mp4",
                         "Content-Disposition": 'attachment; filename="Title.m4b"'}
              def __init__(self): self.body = b"x" * 2048
              def read(self, n=-1):
                  out, self.body = (self.body, b"") if n is None or n < 0 else (self.body[:n], self.body[n:])
                  return out
              def __enter__(self): return self
              def __exit__(self, *a): return False

          class Client:
              def __init__(self): self.fetched = []
              def open_download(self, item_id, timeout=None):
                  self.fetched.append(item_id); return Resp()

          client = Client()
          item = {"id": "i1", "title": "Title", "author": "Author",
                  "series": "", "relPath": "Author/Title", "numTracks": 1, "size": 2048}
          opts = {"devicePath": str(dev), "subdir": "AUDIOBOOKS", "renameM4b": True,
                  "folderTemplate": "{author} - {title}"}

          rep = sync.pull(client, [item], opts)
          assert rep["copied"] == 1 and not rep["errors"], rep
          expected = dev / "AUDIOBOOKS" / "Author - Title.m4a"
          assert expected.exists(), sorted(p.name for p in (dev / "AUDIOBOOKS").iterdir())

          st = device.status(str(dev), "AUDIOBOOKS", [item])
          assert [b["matchedBy"] for b in st["both"]] == ["id"], st
          assert st["serverOnly"] == [] and st["deviceOnly"] == [], st

          rep = sync.pull(client, [item], opts)
          assert rep["skipped"] == 1 and client.fetched == ["i1"], \
              "a re-run must not download the book again"

          rep = sync.remove(["Author - Title.m4a"], opts)
          assert rep["removed"] == ["Author - Title.m4a"], rep
          assert not expected.exists(), "remove did not delete the file"
          assert index.load(str(dev))["entries"] == {}, "index not cleaned up"

          bad = sync.remove(["../../escape"], opts)
          assert bad["removed"] == [] and bad["errors"], bad
          print("engine OK - download, status, skip-on-rerun, remove, refusal")

          # 2. The host binary the browser actually launches, on this OS.
          cfgfile = tmp / "config.json"
          cfgfile.write_text(json.dumps({"devicePath": str(tmp / "absent")}))
          import os
          env = dict(os.environ, ABSH_CONFIG=str(cfgfile))
          msgs = [{"cmd": "ping"}, {"cmd": "status"}, {"cmd": "nope", "rid": 7}]
          payload = b"".join(struct.pack("<I", len(b)) + b
                             for b in (json.dumps(m).encode() for m in msgs))
          p = subprocess.run([sys.executable, "native/absh_host.py"], input=payload,
                             capture_output=True, timeout=120, env=env)
          assert p.returncode == 0, p.stderr.decode()[:800]
          out, replies, i = p.stdout, [], 0
          while i < len(out):
              n = struct.unpack("<I", out[i:i + 4])[0]; i += 4
              replies.append(json.loads(out[i:i + n])); i += n
          for r in replies:
              print("  host replied:", json.dumps(r)[:160])
          assert len(replies) == 3, replies
          assert replies[0]["ok"] and replies[0]["tags"] in ("mutagen", "builtin")
          assert not replies[1]["ok"] and "not mounted" in replies[1]["error"]
          assert replies[2]["rid"] == 7 and not replies[2]["ok"]
          print("host OK - protocol, framing, request ids, errors as answers")

  extension-lint:
    name: extension lint + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build both bundles
        run: python extension/build.py
      - name: web-ext lint (Firefox bundle)
        run: npx web-ext lint --source-dir extension/dist/firefox --self-hosted

      # The dev build carries the manifest's own version, never a release one,
      # so linting only that let an invalid release version ship: Mozilla no
      # longer allows letters, and 1.0.0a1 reached a published alpha as a
      # VERSION_FORMAT_INVALID error nobody saw. Lint what a tag would build.
      - name: web-ext lint (Firefox bundle, at a release version)
        run: |
          for TAG in v1.0.0-alpha.1 v1.2.3-beta.2 v2.0.0-rc.1 v1.2.3; do
            V=$(python3 tools/release_version.py "$TAG" --field firefox)
            echo "::group::$TAG -> $V"
            python3 extension/build.py --target firefox --version "$V"
            npx web-ext lint --source-dir extension/dist/firefox --self-hosted
            echo "::endgroup::"
          done
          python3 extension/build.py    # leave the dev build in place
      - name: addons-linter (Chrome bundle - catches MV3 mistakes too)
        run: npx addons-linter extension/dist/chrome || true

  extension-unit:
    name: extension unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build bundles
        run: python extension/build.py
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }} chromium
      - name: Run Playwright
        run: |
          set +e
          npx playwright test --project=${{ matrix.browser }} --reporter=list > pw.log 2>&1
          code=$?
          echo "----- playwright output -----"
          cat pw.log
          # Job logs need auth to read; workflow-command annotations do not.
          # Emit the head as one annotation so failures are diagnosable from
          # the public check-runs API.
          if [ $code -ne 0 ]; then
            # The message is at the TOP; the tail is just stack frames.
            msg=$(head -c 3000 pw.log | sed 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=playwright-${{ matrix.browser }}::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: package artefacts
    runs-on: ubuntu-latest
    needs: [native, native-smoke, extension-lint, extension-unit, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the release artefacts (dry run of the real packaging)
        # Same path a tag takes, so the release cannot fail on packaging alone.
        run: |
          python3 extension/icons/make_icons.py
          python3 tools/package.py --tag v0.0.0
      - uses: actions/upload-artifact@v5
        with:
          name: extension-bundles
          path: release/
          retention-days: 30
